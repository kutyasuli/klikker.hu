# Site wide configuration

title: "Klikker.hu"
description: "A klikkeres képzés vidám világa – tanulj és taníts kényszer, büntetés és félelem nélkül!"
logo: # 120x120 px default image used for Twitter summary card
teaser: # 400x250 px default teaser image used in image archive grid
locale: hu-HU
url: "https://klikker.hu"
feed:
  path: atom.xml

# Jekyll configuration

sass:
  sass_dir: _sass
  style: compressed
kramdown:
  toc_levels: 1..2
highlighter: rouge
plugins:
  - jekyll-sitemap
  - jekyll-feed


# Site owner
owner:
  name: Klikker.hu
  email:
  twitter:
  google:
    ad-client:
    ad-slot:
  bio:
  avatar: bio-photo.jpg # 160x160 px image for author byline
  disqus-shortname:


include:
  - .htaccess
exclude:
  - "*.less"
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - config
  - gulpfile.js
  - lib
  - log
  - node_modules
  - package.json
  - spec
  - tmp

# Site Author
author:
  name: Klikker.hu
  email:

# Layout Settings

# Site defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: default
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: default
